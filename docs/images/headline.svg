    <path d="M 43.52 87.53 L 54.06 85.19 L 51.23 95.09 Z" fill="#2E7D32"/>
    <circle cx="60.00" cy="60.00" r="15.20" fill="none" stroke="#2E7D32" stroke-width="7"/>
  </g>
</svg>
