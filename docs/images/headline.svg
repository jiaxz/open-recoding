<svg xmlns="http://www.w3.org/2000/svg" width="248" height="248" viewBox="0 0 248 248" role="img" aria-label="这是一个Coding Agent — native multi-agent, endless agent loop">
  <title>这是一个Coding Agent — native multi-agent, endless agent loop</title>
  <defs>
    <!-- 浅色微渐变底板 -->
    <linearGradient id="hl-card-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAF9"/>
    </linearGradient>

    <!-- 品牌淡绿点阵：浅灰绿点 -->
    <pattern id="hl-dots-light" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#2E7D32" opacity="0.08"/>
    </pattern>

    <!-- Coding Agent 强调绿色：在白色背景上高对比度深绿渐变 -->
    <linearGradient id="hl-green-text-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
  </defs>

  <!-- 白色正方形卡片底板，搭配细腻浅灰边框 -->
  <rect x="1" y="1" width="246" height="246" rx="22" fill="url(#hl-card-light)" stroke="#E1E6E2" stroke-width="1.5"/>
  <rect x="1" y="1" width="246" height="246" rx="22" fill="url(#hl-dots-light)"/>

  <!-- 主标题方框：浅白底色 -->
  <rect x="22" y="24" width="204" height="114" rx="10" fill="#FFFFFF" stroke="#C8D6CA" stroke-width="1.5"/>

  <!-- 四角加粗 Corner Ticks 极客标记（清晰深绿色） -->
  <g fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85">
    <path d="M 22 38 V 24 H 36"/>
    <path d="M 212 24 H 226 V 38"/>
    <path d="M 226 114 V 128 H 212"/>
    <path d="M 36 128 H 22 V 114"/>
  </g>

  <!-- 主标题两行，居中框内（深黑炭灰 + 森林深绿） -->
  <text x="124" y="65" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, WenQuanYi Micro Hei, sans-serif" font-size="20" font-weight="600" letter-spacing="1.5" fill="#1C1F20">这是一个</text>
  <text x="124" y="103" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, PingFang SC, sans-serif" font-size="22" font-weight="700" letter-spacing="0.5" fill="url(#hl-green-text-light)">Coding Agent</text>

  <!-- 分隔微点 -->
  <circle cx="124" cy="158" r="1.5" fill="#2E7D32" opacity="0.35"/>

  <!-- 副标题两行：monospace 更小字体（中炭灰） -->
  <text x="124" y="185" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="12" letter-spacing="0.8" fill="#5A645D">native multi-agent</text>
  <text x="124" y="209" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="12" letter-spacing="0.8" fill="#5A645D">endless agent loop</text>

  <!-- 品牌原生闭环 logomark（置于顶层，右上角完整可见） -->
  <g transform="translate(192, 10) scale(0.32)" opacity="0.85">
